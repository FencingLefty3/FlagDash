[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "DashFlag"
version = "2026.0.6"
description = "A Terminal Puzzle Game"
readme = "README.md"
requires-python = ">=3.9"

[tool.hatch.build.targets.wheel]
packages = ["src/DashFlag"]

[project.scripts]
DashFlag = "DashFlag.cli:main"
